# Builds the desktop installers on GitHub-hosted macOS and Windows runners
# (book/src/desktop.md, Chinese). It runs on version tags and by hand.

name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      e2e_only:
        description: Run only the WebView2 e2e job, without the installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web build
    # The frontend and its subtitle fonts come from the flake, so the
    # installers embed the same build as the server package. CI's web check
    # usually has the result in the Actions cache already.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/nix
      - name: Build the frontend
        run: |
          nix build .#web --out-link web-result
          # The artifact upload does not follow the store symlink.
          cp -rL --no-preserve=mode web-result web-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: web-dist
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: bundle (${{ matrix.target }})
    needs: web
    if: ${{ !inputs.e2e_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. Intel Macs would need a second build and a
          # second pinned ffmpeg.
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      SQLX_OFFLINE: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: web/build
      # Keep Rust aligned with the flake. Platform-specific dependencies
      # still need native builds on each target.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch the pinned ffmpeg
        run: scripts/desktop/fetch-ffmpeg.sh ${{ matrix.target }}
      - name: Make the fixture library
        run: |
          ffmpeg=$(echo desktop/src-tauri/binaries/ffmpeg-${{ matrix.target }}*)
          scripts/desktop/make-fixture.sh "$ffmpeg" "$RUNNER_TEMP/library"
      # tauri.bundle.conf.json adds the ffmpeg sidecars, the license files
      # and ad-hoc macOS signing. The installers are not signed with a
      # developer certificate (docs/en/desktop.md).
      - name: Build the bundle
        working-directory: desktop/src-tauri
        run: >-
          npx --yes @tauri-apps/cli@2.12.1 build --ci
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
          --config tauri.bundle.conf.json

      # Step timeouts stop a hung app before the job's overall deadline.
      - name: Smoke test the app bundle
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          BUNDLE: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          app=$(echo "$BUNDLE"/macos/*.app)
          test -f "$app/Contents/Resources/licenses/FFMPEG.txt"
          exe=$(find "$app/Contents/MacOS" -type f ! -name ffmpeg ! -name ffprobe | head -n 1)
          status=0
          "$exe" --smoke "$RUNNER_TEMP/smoke.txt" "$RUNNER_TEMP/library" || status=$?
          cat "$RUNNER_TEMP/smoke.txt"
          exit "$status"

      # tauri-driver does not support macOS, so this only starts the app
      # the way a user who chose local mode would, with its window, and
      # checks its embedded server from outside.
      - name: Launch the app in local mode
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          BUNDLE: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          support="$HOME/Library/Application Support"
          mkdir -p "$support/io.github.qwerchin.kikoeru-neo" "$support/kikoeru-neo"
          echo '{"mode":"local","server_url":null}' > "$support/io.github.qwerchin.kikoeru-neo/desktop.json"
          printf '[metadata]\nsource = "none"\n' > "$support/kikoeru-neo/config.toml"
          app=$(echo "$BUNDLE"/macos/*.app)
          exe=$(find "$app/Contents/MacOS" -type f ! -name ffmpeg ! -name ffprobe | head -n 1)
          log="$RUNNER_TEMP/app.log"
          NO_COLOR=1 RUST_LOG=info "$exe" > "$log" 2>&1 &
          pid=$!
          port=
          for _ in $(seq 120); do
            port=$(sed -n 's/.*listening address=127\.0\.0\.1:\([0-9]*\).*/\1/p' "$log" | head -n 1)
            [ -n "$port" ] && break
            sleep 0.5
          done
          status=1
          if [ -n "$port" ]; then
            curl --fail --silent --show-error "http://127.0.0.1:$port/api/health" &&
              curl --fail --silent --show-error "http://127.0.0.1:$port/api/version" &&
              status=0
          fi
          kill "$pid" || true
          cat "$log"
          exit "$status"

      # Installs silently into a temporary directory and runs the installed
      # copy, so the check covers what the installer actually lays down.
      - name: Smoke test the installer
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          BUNDLE: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          $installer = Get-ChildItem "$env:BUNDLE/nsis/*-setup.exe" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'kikoeru-neo'
          Start-Process $installer.FullName -ArgumentList '/S', "/D=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir 'licenses/FFMPEG.txt'))) { throw 'the licenses folder is missing' }
          $exe = Get-ChildItem "$dir/*.exe" |
            Where-Object { $_.Name -notin 'ffmpeg.exe', 'ffprobe.exe' -and $_.Name -notlike 'uninstall*' } |
            Select-Object -First 1
          $report = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          # A release build is a GUI program, so it writes to the report
          # file and the exit code is the result.
          $library = Join-Path $env:RUNNER_TEMP 'library'
          $run = Start-Process $exe.FullName -ArgumentList '--smoke', $report, $library -Wait -PassThru
          Get-Content $report
          exit $run.ExitCode

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kikoeru-neo-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  # Drives a test build of the app on Windows through tauri-driver and
  # msedgedriver (desktop/e2e/run.mjs): the first run in local mode, a
  # library added with the folder picker, playback in WebView2, then remote
  # mode against a second server. Any CSP violation on any page fails it.
  # The test build differs from the release only in the `e2e` feature, which
  # lets pick_folder return a fixed path instead of showing the system
  # dialog, and adds the --e2e-server mode used for remote mode.
  webview2-e2e:
    name: WebView2 e2e
    needs: web
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SQLX_OFFLINE: "true"
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: web/build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: e2e
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch the pinned ffmpeg
        run: scripts/desktop/fetch-ffmpeg.sh "$TARGET"
      - name: Make the fixture library
        run: scripts/desktop/make-fixture.sh "desktop/src-tauri/binaries/ffmpeg-$TARGET.exe" "$RUNNER_TEMP/library"
      # Without a bundle: the sidecars are copied next to the executable in
      # the target directory, which is where the app looks for them.
      - name: Build the test app
        working-directory: desktop/src-tauri
        run: >-
          npx --yes @tauri-apps/cli@2.12.1 build --ci --no-bundle
          --target "$TARGET" --features e2e
          --config tauri.bundle.conf.json
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      # msedgedriver has to match the installed WebView2 runtime, which
      # changes with the runner image, so it is not pinned.
      - name: Fetch msedgedriver
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Output "WebView2 runtime $version"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'edgedriver')
      # Starts the test app on its own first, so a crash at startup shows
      # in the log instead of only as a WebDriver session error.
      - name: Start the test app once
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        run: |
          $exe = 'desktop\src-tauri\target\x86_64-pc-windows-msvc\release\kikoeru-neo-desktop.exe'
          $out = Join-Path $env:RUNNER_TEMP 'app-first-start.log'
          $env:RUST_LOG = 'debug'
          $env:NO_COLOR = '1'
          $app = Start-Process $exe -PassThru -RedirectStandardError $out -RedirectStandardOutput "$out.stdout"
          Start-Sleep -Seconds 20
          if ($app.HasExited) { Write-Output "the app exited with $($app.ExitCode)" } else { Stop-Process -Id $app.Id -Force }
          Get-Content $out, "$out.stdout" -ErrorAction SilentlyContinue | Select-Object -Last 60
          Get-ChildItem "$env:LOCALAPPDATA\io.github.qwerchin.kikoeru-neo" -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
          # The next start must be a first run again.
          Remove-Item "$env:APPDATA\io.github.qwerchin.kikoeru-neo" -Recurse -Force -ErrorAction SilentlyContinue
      # msedgedriver's own log, for when the WebDriver session fails.
      - name: Wrap msedgedriver with logging
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Set-Content (Join-Path $dir 'msedgedriver-logged.cmd') "@`"$dir\msedgedriver.exe`" --verbose --log-path=`"$env:RUNNER_TEMP\msedgedriver.log`" %*"
      - name: Run the WebDriver test
        working-directory: desktop/e2e
        timeout-minutes: 20
        run: |
          mkdir -p "$APPDATA/kikoeru-neo"
          printf '[metadata]\nsource = "none"\n' > "$APPDATA/kikoeru-neo/config.toml"
          npm ci --ignore-scripts
          # A second server from the same build, for remote mode. It scans
          # the fixture itself and writes its port when it is ready.
          export KIKOERU_NEO_E2E_REMOTE_PASSWORD=$(node -e "console.log(require('crypto').randomBytes(16).toString('hex'))")
          port_file="$RUNNER_TEMP/remote-port"
          "$KIKOERU_NEO_E2E_APP" --e2e-server "$KIKOERU_NEO_E2E_LIBRARY" "$port_file" &
          remote=$!
          for _ in $(seq 300); do [ -s "$port_file" ] && break; sleep 1; done
          [ -s "$port_file" ] || { echo "the remote server did not start"; exit 1; }
          export KIKOERU_NEO_E2E_REMOTE_URL="http://127.0.0.1:$(cat "$port_file")"
          status=0
          node run.mjs || status=$?
          kill "$remote" || true
          exit "$status"
        env:
          KIKOERU_NEO_E2E_APP: ${{ github.workspace }}\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\kikoeru-neo-desktop.exe
          KIKOERU_NEO_E2E_LIBRARY: ${{ runner.temp }}\library
          KIKOERU_NEO_E2E_PICK_FOLDER: ${{ runner.temp }}\library
          TAURI_DRIVER: tauri-driver
          NATIVE_DRIVER: ${{ runner.temp }}\edgedriver\msedgedriver-logged.cmd
          SCREENSHOTS: ${{ runner.temp }}\screenshots
      - name: Collect the app's WebView2 variables
        if: always()
        run: cp "$TEMP/kikoeru-neo-e2e-env.txt" "$RUNNER_TEMP/" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: webview2-e2e-logs
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/msedgedriver.log
            ${{ runner.temp }}/app-first-start.log*
            ${{ runner.temp }}/kikoeru-neo-e2e-env.txt
          if-no-files-found: ignore
          retention-days: 14
