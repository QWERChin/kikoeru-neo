# Publishes tagged images to ghcr.io/qwerchin/kikoeru-neo and standalone
# servers to GitHub Releases. See book/src/deployment.md (Chinese).
# Only X.Y.Z and X.Y are pushed, never latest. Existing X.Y.Z tags must
# match the image config digest before a retry can update floating tags.

name: Release

on:
  push:
    tags: ["v*"]
  # Retry an existing tag after a failed run. An identical version image
  # is kept, and a missing floating tag can be published.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish, such as v0.1.0"
        required: true

permissions:
  contents: read

# One release at a time, because the script reads X.Y right before it moves
# it forward, and two runs at once could move it back. GitHub keeps only one
# pending run per group and cancels older pending ones, so a third tag
# pushed while one runs and one waits cancels the waiting one. Publish that
# tag again with workflow_dispatch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: require CI on main
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      # Old tags may predate the gate script. Read it from this workflow's
      # commit, but check the tag's HEAD and CI ignore rules on every retry.
      - name: Require successful CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git show "$WORKFLOW_SHA:scripts/release-ci-gate.py" > "$RUNNER_TEMP/release-ci-gate.py"
          python3 "$RUNNER_TEMP/release-ci-gate.py" --repo "$REPO"

  image:
    name: publish image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: ./.github/actions/nix

      # Built and pushed in this one job, so the image holds the neo-server
      # stamped with this commit. Only x86_64 is published.
      - name: Publish the image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          nix build -o "$RUNNER_TEMP/image-stream" .#packages.x86_64-linux.docker-image
          "$RUNNER_TEMP/image-stream" > "$RUNNER_TEMP/image.tar"
          nix run .#packages.x86_64-linux.kikoeru-neo-ghcr-release -- \
            --tag "$TAG" --image "$RUNNER_TEMP/image.tar"
          rm -f "$RUNNER_TEMP/image.tar"

  binary:
    name: publish standalone server
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: ./.github/actions/nix
      - name: Publish immutable assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          nix build -o "$RUNNER_TEMP/static" .#packages.x86_64-linux.neo-server-static
          python3 scripts/github-release.py --repo "$REPO" --tag "$TAG" \
            --binary "$RUNNER_TEMP/static/bin/kikoeru-neo"
